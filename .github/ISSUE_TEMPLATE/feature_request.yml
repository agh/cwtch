name: Feature request
description: Propose a change to cwtch
labels:
  - enhancement
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem needs to be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the command, output, storage, or configuration behaviour you propose.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered?

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Note any effect on existing profiles, Cwtchfiles, scripts, or synced files.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: I have not included credentials or private repository information.
          required: true
