name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write # record the attestation against the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # `cwtch version`, `cwtch --help` and the Homebrew formula all derive the
      # version from a different place. If VERSION and the tag disagree, every
      # installed copy misreports itself and the built-in update check compares
      # the wrong numbers.
      - name: Verify VERSION matches the tag
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::release tag must be vMAJOR.MINOR.PATCH, got %s\n' "${RELEASE_TAG}"
            exit 1
          fi
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${RELEASE_TAG#v}"
          printf 'VERSION file: %s\ntag:          %s\n' "${file_version}" "${RELEASE_TAG}"
          if [[ "${file_version}" != "${tag_version}" ]]; then
            printf '::error::VERSION is %s but the tag is %s\n' "${file_version}" "${RELEASE_TAG}"
            exit 1
          fi
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${tag_version}" >> "${GITHUB_OUTPUT}"

      # Checksum the archive Homebrew actually downloads. A tarball built here
      # with `git archive` would hash differently from
      # codeload.github.com/.../tar.gz/refs/tags/<tag>, so publishing one would
      # give the formula a checksum it can never match. Nothing is signed in
      # CI: release tags are signed on the maintainer's machine, and no signing
      # key belongs in a workflow.
      - name: Checksum the GitHub source archive
        id: archive
        env:
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="cwtch-${RELEASE_VERSION}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors \
            -o "dist/${name}" \
            "https://github.com/${REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          ( cd dist && sha256sum "${name}" > SHA256SUMS )
          cat dist/SHA256SUMS
          printf 'name=%s\n' "${name}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Published as .intoto.jsonl so that OpenSSF Scorecard's Signed-Releases
      # check can find it; `gh attestation verify` reads the same bundle.
      - name: Collect the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" "dist/${ARCHIVE_NAME}.intoto.jsonl"
          ls -l dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SHA256SUMS
            dist/*.intoto.jsonl
