name: Code scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the sources to scan
      security-events: write # upload the SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors \
            -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum -c -
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Every shell-bearing tracked file, not just the ones that ship: the test
      # suite, its helpers and the devcontainer provisioning script run real
      # code on real machines and deserve the same scrutiny. .bats files carry
      # no shebang, so they need an explicit -s bash and a second pass.
      - name: Run shellcheck
        run: |
          set -euo pipefail
          status=0
          shellcheck -f json1 -x \
            bin/cwtch lib/*.sh scripts/*.sh .devcontainer/setup.sh \
            > "${RUNNER_TEMP}/shell.json" || status=$?
          if [[ "${status}" -gt 1 ]]; then
            exit "${status}"
          fi
          status=0
          shellcheck -f json1 -s bash tests/helpers.bash tests/*.bats \
            > "${RUNNER_TEMP}/tests.json" || status=$?
          if [[ "${status}" -gt 1 ]]; then
            exit "${status}"
          fi
          jq -s '{comments: (.[0].comments + .[1].comments)}' \
            "${RUNNER_TEMP}/shell.json" "${RUNNER_TEMP}/tests.json" > shellcheck.json
          jq '.comments | length' shellcheck.json

      - name: Convert the results to SARIF
        run: |
          set -euo pipefail
          version="$(shellcheck --version | awk '/^version:/ { print $2 }')"
          jq --arg tool_version "${version}" \
            -f scripts/shellcheck-to-sarif.jq \
            shellcheck.json > shellcheck.sarif

      - name: Upload the results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the sources to scan
      security-events: write # upload the SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: v1.30.0
          persona: auditor
          min-severity: low
          min-confidence: medium
